# Troca as thumbs provisórias (foto de banco) por thumbs 100% IA assim que a cota grátis de imagem voltar
# (a da Cloudflare volta às 00:00 UTC = 21h de Brasília). Roda de hora em hora; sem pendência, termina em segundos.
name: thumbs
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
concurrency:
  group: thumbs
  cancel-in-progress: false
jobs:
  thumbs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SEM_PROXY_PELO_SERVIDOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with: { path: ~/.u2net, key: rembg-isnet-v1 }
      - run: pip install -q "requests[socks]>=2.31" pillow "rembg[cpu]>=2.0.60" "qrcode>=7.4" "google-auth-oauthlib>=1.2" "google-api-python-client>=2.150" > /dev/null 2>&1
      - name: Refazer thumbs (log privado)
        run: |
          set +e
          python rede-youtube/fabrica/fabrica.py --thumbs > log.txt 2>&1
          code=$?
          curl -s -o /dev/null -X POST "$SUPABASE_URL/storage/v1/object/logs/thumbs/$(date -u +%Y%m%d-%H).txt" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: text/plain" -H "x-upsert: true" --data-binary @log.txt
          echo "terminou (código $code)"
          exit $code
