# Fábrica: faz os vídeos da fila e publica. Repositório público = minutos ilimitados.
# O log NÃO aparece aqui: vai para o armazenamento privado (Supabase Storage, balde "logs").
name: fabrica
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
concurrency:
  group: fabrica
  cancel-in-progress: false
permissions:
  actions: write
  contents: read
jobs:
  fabrica:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      KOKORO_DIR: ${{ github.workspace }}/.kokoro
      MAX_POR_RODADA: "3"
      PUBLICAR_DIRETO: "1"
      SEM_PROXY_PELO_SERVIDOR: "1"
      IMAGENS_NAS_CENAS: "0"
    steps:
      - name: Fila
        id: fila
        run: |
          n=$(curl -s "$SUPABASE_URL/rest/v1/yt_jobs?select=id&or=(status.in.(na_fila,refazer),and(status.eq.aprovado,or(published_at.is.null,published_at.lte.$(date -u +%Y-%m-%dT%H:%M:%SZ))))" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - if: steps.fila.outputs.n != '0'
        uses: actions/checkout@v4
      - if: steps.fila.outputs.n != '0'
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - if: steps.fila.outputs.n != '0'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - if: steps.fila.outputs.n != '0'
        uses: actions/cache@v4
        with: { path: .kokoro, key: kokoro-v1.0 }
      - if: steps.fila.outputs.n != '0'
        uses: actions/cache@v4
        with: { path: ~/.u2net, key: rembg-isnet-v1 }
      - if: steps.fila.outputs.n != '0'
        run: |
          mkdir -p .kokoro && cd .kokoro
          [ -f kokoro-v1.0.onnx ] || curl -sL -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f voices-v1.0.bin ] || curl -sL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - if: steps.fila.outputs.n != '0'
        run: |
          pip install -q "requests[socks]>=2.31" "kokoro-onnx>=0.4" soundfile pillow "rembg[cpu]>=2.0.60" "qrcode>=7.4" "google-auth-oauthlib>=1.2" "google-api-python-client>=2.150" > /dev/null 2>&1
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then npm install -g -q @anthropic-ai/claude-code > /dev/null 2>&1; fi
      - if: steps.fila.outputs.n != '0'
        name: Fazer vídeos (log privado)
        run: |
          set +e
          python rede-youtube/fabrica/fabrica.py > log.txt 2>&1
          code=$?
          curl -s -o /dev/null -X POST "$SUPABASE_URL/storage/v1/bucket" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" -d '{"id":"logs","name":"logs","public":false}'
          curl -s -o /dev/null -X POST "$SUPABASE_URL/storage/v1/object/logs/fabrica/$(date -u +%Y%m%d-%H%M)-${GITHUB_RUN_ID}.txt" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: text/plain" -H "x-upsert: true" --data-binary @log.txt
          echo "rodada terminou (código $code); detalhes no log privado"
          exit $code
      - name: Ainda tem fila? Emenda a próxima rodada
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(curl -s "$SUPABASE_URL/rest/v1/yt_jobs?select=id&or=(status.in.(na_fila,refazer),and(status.eq.aprovado,or(published_at.is.null,published_at.lte.$(date -u +%Y-%m-%dT%H:%M:%SZ))))" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          if [ "${{ steps.fila.outputs.n }}" != "0" ] && [ "$n" != "0" ]; then gh workflow run fabrica.yml --repo "$GITHUB_REPOSITORY" --ref main; fi
